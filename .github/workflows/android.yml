name: TerraUnlocked Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK (development only)
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TerraUnlocked-development-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Check stable signing is configured
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.TERRA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TERRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TERRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TERRA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stable signing secrets not configured; only development debug APK produced."
          fi
      - name: Build consistently signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          TERRA_KEYSTORE_BASE64: ${{ secrets.TERRA_KEYSTORE_BASE64 }}
          TERRA_KEYSTORE_PASSWORD: ${{ secrets.TERRA_KEYSTORE_PASSWORD }}
          TERRA_KEY_ALIAS: ${{ secrets.TERRA_KEY_ALIAS }}
          TERRA_KEY_PASSWORD: ${{ secrets.TERRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$TERRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/terra-release.jks"
          export TERRA_KEYSTORE_PATH="$RUNNER_TEMP/terra-release.jks"
          gradle :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/terra-release.jks"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: TerraUnlocked-signed-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish signed APK as latest GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "TerraUnlocked-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "TerraUnlocked-$TAG.apk" --clobber
          else
            gh release create "$TAG" "TerraUnlocked-$TAG.apk" --title "TerraUnlocked $TAG" --notes "Signed Android app update. Install over your existing signed version to retain exploration data." --latest --target "${GITHUB_SHA}"
          fi
